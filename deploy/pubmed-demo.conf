# ============================================================
# PubMed 领域分析 Demo —— nginx 配置（模板文件，勿直接使用）
#
# deploy.sh 会把 __INSTALL_DIR__ / __APP_PORT__ / __PUBLIC_PORT__
# 替换成实际值后安装到 /etc/nginx/conf.d/pubmed-demo.conf。
#
# 为什么是独立文件而不是改现有配置：
#   这台机器上已经跑着一整套服务（80 nginx 入口 / 8080 AI 助手 /
#   5100 NetSec / 5200 Brain / 3306 MySQL / 6379 Redis），
#   改坏任何一个 server 块都会连带挂掉线上服务。
#   所以本 demo 用「独立 conf + 独立端口 + reload」的方式接入，
#   对现有配置零改动，卸载时删掉本文件再 reload 即可。
#
# 端口分配：
#   __PUBLIC_PORT__（默认 5300）  nginx 对外，唯一暴露面
#   __APP_PORT__（默认 8000）     uvicorn，只听 127.0.0.1，不对公网
# ============================================================

server {
    listen __PUBLIC_PORT__;
    server_name _;
    charset utf-8;

    # 不暴露 nginx 版本号；.env / .git 等 dotfile 一律 404
    server_tokens off;

    # 期刊表 JSON 上传（POST /api/journals/import）的体积上限
    client_max_body_size 10m;

    access_log /var/log/nginx/pubmed-demo.access.log;
    error_log  /var/log/nginx/pubmed-demo.error.log warn;

    # ---- 压缩（演示时首屏更快，CPU 开销可忽略）----
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # ---- 前端静态产物（Vite build）----
    root __INSTALL_DIR__/frontend/dist;
    index index.html;

    # 带内容哈希的构建产物：一年长缓存，发布即失效，无需清理
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- API 反向代理到本机 uvicorn ----
    location /api/ {
        proxy_pass http://127.0.0.1:__APP_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI 综述要等 DeepSeek 生成，读超时放到 120s
        proxy_read_timeout 120s;
        proxy_send_timeout 60s;
        # 聚合结果是大 JSON，关掉缓冲直接流式回给浏览器
        proxy_buffering off;
    }

    # FastAPI 自带交互式文档：现场演示接口时直接用
    location = /docs        { proxy_pass http://127.0.0.1:__APP_PORT__/docs; }
    location = /openapi.json { proxy_pass http://127.0.0.1:__APP_PORT__/openapi.json; }
    location = /redoc       { proxy_pass http://127.0.0.1:__APP_PORT__/redoc; }

    # ---- SPA 回退：/about 等前端路由回 index.html，交给 react-router ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- dotfile 一律拒绝（.env / .git 等）----
    location ~ /\. {
        deny all;
    }
}
